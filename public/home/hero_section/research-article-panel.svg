<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" fill="none">
<defs>
  <filter id="shadow" x="0" y="0" width="1180" height="760" color-interpolation-filters="sRGB">
    <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#2A5FD633" />
  </filter>
  <linearGradient id="panelbg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="1" stop-color="#F7FAFF"/>
  </linearGradient>
  <linearGradient id="sidebar" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FCFEFF"/>
    <stop offset="1" stop-color="#F4F8FF"/>
  </linearGradient>
  <linearGradient id="annot" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFCC6B"/>
    <stop offset="1" stop-color="#FFD992"/>
  </linearGradient>
</defs>
<g filter="url(#shadow)">
  <rect x="60" y="60" width="1060" height="640" rx="32" fill="url(#panelbg)"/>
  <rect x="60" y="60" width="1060" height="72" rx="32" fill="#FFFFFF"/>
  <rect x="60" y="100" width="1060" height="600" rx="0 0 32 32" fill="url(#panelbg)"/>
  <circle cx="114" cy="96" r="10" fill="#FFB4AA"/>
  <circle cx="146" cy="96" r="10" fill="#FFD38A"/>
  <circle cx="178" cy="96" r="10" fill="#BCE9C1"/>
