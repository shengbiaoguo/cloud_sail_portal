  <text x="140" y="190" font-size="56" font-weight="700" fill="#213458" font-family="Arial, Helvetica, sans-serif">Research Article</text>
  <text x="140" y="232" font-size="22" fill="#7F8EA8" font-family="Arial, Helvetica, sans-serif">Structured editing preview for international journal submission</text>

  <!-- article text lines -->
  <rect x="140" y="270" width="560" height="16" rx="8" fill="#D9E4F8"/>
  <rect x="140" y="300" width="580" height="16" rx="8" fill="#E4ECFA"/>
