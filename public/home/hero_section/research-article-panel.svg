  <path d="M749 396h17M749 406h12M749 416h16" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <rect x="736" y="508" width="44" height="44" rx="14" fill="#2F67E7"/>
  <path d="M750 523l16 14M766 523l-16 14" stroke="white" stroke-width="4" stroke-linecap="round"/>

