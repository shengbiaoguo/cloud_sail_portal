  <rect x="140" y="390" width="600" height="16" rx="8" fill="#E4ECFA"/>
  <rect x="140" y="420" width="510" height="16" rx="8" fill="#E4ECFA"/>
  <rect x="140" y="450" width="590" height="16" rx="8" fill="#E4ECFA"/>
  <rect x="140" y="480" width="530" height="16" rx="8" fill="#E4ECFA"/>
  <rect x="140" y="510" width="430" height="16" rx="8" fill="#E4ECFA"/>

  <!-- highlights and comments -->
  <rect x="336" y="330" width="170" height="16" rx="8" fill="url(#annot)" fill-opacity="0.9"/>
  <rect x="236" y="420" width="230" height="16" rx="8" fill="#A7CBFF" fill-opacity="0.85"/>
  <rect x="174" y="480" width="194" height="16" rx="8" fill="url(#annot)" fill-opacity="0.9"/>

  <path d="M520 338 C600 338, 650 290, 760 288" stroke="#8DB3FB" stroke-width="4" stroke-linecap="round"/>
